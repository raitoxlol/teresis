name: teresis
version: 0.1.0
description: "Local SQLite memory provider with scoped recall, versioned facts and shared MCP storage."
requires_hermes: ">=0.23.3"
config_schema:
  embed_api_key:
    type: secret
    env: TERESIS_EMBED_KEY
    required: false
    description: "Optional bearer key for an explicitly configured OpenAI-compatible embedding endpoint."
