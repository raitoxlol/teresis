[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teresis"
version = "0.1.0"
description = "Local, zero-dependency long-term memory provider for AI agents (SQLite FTS5 + optional vectors, MCP server)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.24"]

[project.scripts]
teresis = "teresis.cli:main"

[project.entry-points."hermes_agent.memory_providers"]
teresis = "teresis.hermes"

[tool.setuptools.packages.find]
where = ["src"]
