[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teresis"
version = "0.1.0"
description = "Local, zero-dependency long-term memory provider for AI agents (SQLite FTS5 + optional vectors, MCP server)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "raitoxlol", email = "wright@raitox.tech" }]
keywords = ["memory", "ai-agents", "hermes", "mcp", "sqlite", "fts5", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.24"]
rerank = ["fastembed>=0.5"]
all = ["numpy>=1.24", "fastembed>=0.5"]

[project.urls]
Homepage = "https://www.raitox.tech/teresis"
Repository = "https://github.com/raitoxlol/teresis"
Issues = "https://github.com/raitoxlol/teresis/issues"

[project.scripts]
teresis = "teresis.cli:main"

[project.entry-points."hermes_agent.memory_providers"]
teresis = "teresis.hermes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teresis = ["plugin.yaml", "README.md"]
