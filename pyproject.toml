[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo"
version = "0.1.0"
description = "Local, zero-dependency long-term memory provider for AI agents (SQLite FTS5 + optional vectors, MCP server)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.24"]

[project.scripts]
mnemo = "mnemo.cli:main"

[project.entry-points."hermes_agent.memory_providers"]
mnemo = "mnemo.hermes"

[tool.setuptools.packages.find]
where = ["src"]
