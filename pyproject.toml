[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teresis"
version = "0.1.0"
description = "Local, zero-dependency long-term memory provider for AI agents (SQLite FTS5 + optional vectors, MCP server)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["memory", "ai-agents", "hermes", "mcp", "sqlite", "fts5", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.24"]
rerank = ["fastembed>=0.5"]
all = ["numpy>=1.24", "fastembed>=0.5"]

[project.scripts]
teresis = "teresis.cli:main"

[project.entry-points."hermes_agent.memory_providers"]
teresis = "teresis.hermes"

[tool.setuptools.packages.find]
where = ["src"]
